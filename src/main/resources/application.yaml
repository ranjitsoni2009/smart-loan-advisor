spring:
  application:
    name: smart-loan-advisor
  datasource:
    url: jdbc:h2:file:./data/chatdb  # Gives your in-memory DB a static name
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG