spring:
  application:
    name: smart-loan-advisor
  datasource:
    url: jdbc:h2:file:./data/chatdb  # Gives your in-memory DB a static name
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
          neo4j:
            session-label: Session
            message-label: Message
            tool-call-label: ToolCall
            metadata-label: Metadata
            tool-response-label: ToolResponse
            media-label: Media
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG